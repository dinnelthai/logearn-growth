name: AI infrastructure checks

on:
  pull_request:
    paths:
      - 'backend/src/ai/**'
      - 'backend/src/routes/aiAnalysis.js'
      - 'backend/test/**'
      - 'frontend/src/pages/aiAnalysis.js'
      - 'frontend/src/api/aiAnalysis.js'
      - 'backend/package*.json'
      - '.github/workflows/ai-infrastructure.yml'
  push:
    branches:
      - 'chore/ai-infrastructure-baseline-20261027'
    paths:
      - 'backend/src/ai/**'
      - 'backend/src/routes/aiAnalysis.js'
      - 'backend/test/**'
      - 'backend/package*.json'
      - '.github/workflows/ai-infrastructure.yml'

permissions:
  contents: read

jobs:
  ai-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check src/ai/business/trace.js
          node --check src/ai/business/runner.js
          node --check src/ai/business/checkpointState.js
          node --check src/ai/business/transcriptRecovery.js
          node --check src/ai/business/resumePlan.js
          node --check src/ai/business/foundation.js
          node --check src/ai/business/workerStart.js
          node --check src/db/aiRecords.js
          node --check test/workerLeaseIntegration.test.js
          node --check src/queues/jobs/businessAnalysis.js
          node --check src/queues/workers/aiAnalysisWorker.js
          node --check src/routes/aiAnalysis.js
      - name: Run offline agent contract tests
        env:
          NODE_ENV: test
        run: |
          node --test test/analysisResumeHttp.test.js test/resumePlan.test.js test/partialInvestigationResume.test.js test/analysisCancelHttp.test.js test/validatedFinalCheckpoint.test.js test/validatedFinalRecovery.test.js test/workerStart.test.js test/recoveryDecision.test.js test/agentKilledWorker.test.js test/agentRestartPersistence.test.js test/agentFollowupCheckpoint.test.js             test/agentFollowupRunner.test.js             test/agentTrace.test.js             test/agentResponseCheckpoint.test.js             test/agentInvestigationCheckpoint.test.js             test/checkpointState.test.js             test/transcriptRecovery.test.js             test/checkpointHttp.test.js             test/jobStatus.test.js             test/jobStatusHttp.test.js             test/retrySafety.test.js             test/retrySafetyHttp.test.js

  ai-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: PostgreSQL fencing and Bull/Redis contention
        env:
          AI_P0_INTEGRATION: '1'
          AI_DATABASE_URL: postgres://ci:ci@localhost:5432/ai_test
          REDIS_URL: redis://localhost:6379
        run: node --test test/workerLeaseIntegration.test.js

  ai-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
