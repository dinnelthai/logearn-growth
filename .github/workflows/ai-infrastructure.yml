name: AI infrastructure checks

on:
  pull_request:
    paths:
      - 'backend/src/ai/**'
      - 'backend/src/db/**'
      - 'backend/src/queues/**'
      - 'backend/src/routes/aiAnalysis.js'
      - 'backend/test/**'
      - 'frontend/src/pages/aiAnalysis.js'
      - 'frontend/src/api/aiAnalysis.js'
      - 'frontend/src/analytics/__tests__/aiRecoveryPage.test.js'
      - 'backend/package*.json'
      - '.github/workflows/ai-infrastructure.yml'
  push:
    branches:
      - 'chore/ai-infrastructure-baseline-20261027'
      - 'feat/ai-growth-agent'
    paths:
      - 'backend/src/ai/**'
      - 'backend/src/db/**'
      - 'backend/src/queues/**'
      - 'backend/src/routes/aiAnalysis.js'
      - 'backend/test/**'
      - 'frontend/src/pages/aiAnalysis.js'
      - 'frontend/src/api/aiAnalysis.js'
      - 'frontend/src/analytics/__tests__/aiRecoveryPage.test.js'
      - 'backend/package*.json'
      - '.github/workflows/ai-infrastructure.yml'

permissions:
  contents: read

jobs:
  ai-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check src/ai/growth/autonomyBudget.js
          node --check src/ai/growth/researchQuestions.js
          node --check src/ai/optimization/promptRegistry.js
          node --check src/ai/evaluation/promptfooAdapter.js
          node --check src/ai/evaluation/promptGate.js
          node --check src/ai/business/trace.js
          node --check src/ai/business/runner.js
          node --check src/ai/business/checkpointState.js
          node --check src/ai/business/transcriptRecovery.js
          node --check src/ai/business/resumePlan.js
          node --check src/ai/business/foundation.js
          node --check src/ai/growth/skills.js
          node --check src/ai/growth/planner.js
          node --check src/ai/growth/triage.js
          node --check src/ai/growth/actionWorkflow.js
          node --check src/ai/growth/reviewQueue.js
          node --check src/ai/growth/inbox.js
          node --check src/ai/growth/crossDay.js
          node --check src/ai/growth/alertStore.js
          node --check src/ai/growth/monitor.js
          node --check src/ai/growth/investigationStore.js
          node --check src/ai/growth/investigationTimeline.js
          node --check src/ai/growth/notificationStore.js
          node --check src/ai/growth/budget.js
          node --check src/ai/growth/experienceFeedback.js
          node --check src/ai/growth/agentScore.js
          node --check src/ai/growth/agentForecast.js
          node --check src/ai/growth/agentStore.js
          node --check src/ai/growth/agentLearning.js
          node --check src/ai/growth/agentBrief.js
          node --check src/ai/growth/agentAutonomy.js
          node --check src/ai/growth/agentSchedulerHealth.js
          node --check src/ai/growth/agentOutbox.js
          node --check src/ai/growth/agentWebhook.js
          node --check src/queues/workers/growthAutonomyScheduler.js
          node --check src/ai/growth/seoOperations.js
          node --check src/ai/growth/gscSchedule.js
          node --check src/ai/growth/kolOperations.js
          node --check src/ai/growth/seoStore.js
          node --check src/ai/growth/gscClient.js
          node --check src/ai/growth/gscService.js
          node --check src/ai/growth/kolReader.js
          node --check src/ai/business/tools/registry.js
          node --check src/ai/business/tools/adapters.js
          node --check src/queues/workers/growthAlertMonitor.js
          node --check src/ai/growth/daily.js
          node --check src/queues/workers/dailyGrowthScheduler.js
          node --check src/ai/business/workerStart.js
          node --check src/db/aiRecords.js
          node --check test/workerLeaseIntegration.test.js
          node --check src/queues/jobs/businessAnalysis.js
          node --check src/queues/workers/aiAnalysisWorker.js
          node --check src/routes/aiAnalysis.js
      - name: Run offline agent contract tests
        env:
          NODE_ENV: test
        run: |
          node --test test/promptReplay.test.js test/promptfooAdapter.test.js test/promptRegistry.test.js test/autonomyBudget.test.js test/researchQuestions.test.js test/promptGate.test.js test/growthSchedulerHealth.test.js test/growthAgentForecast.test.js test/growthAgentWebhook.test.js test/growthAutonomyHttp.test.js test/growthAutonomyRunner.test.js test/growthAgentAutonomy.test.js test/gscHttp.test.js test/gscClient.test.js test/gscService.test.js test/growthSpecialtyAnalyzeHttp.test.js test/growthSpecialistHttp.test.js test/growthSeo.test.js test/growthKolReader.test.js test/growthSpecialistTools.test.js test/growthInboxHttp.test.js test/growthInvestigationTimelineHttp.test.js test/growthInvestigationTimeline.test.js test/growthProposalHttp.test.js test/growthBudgetIntegration.test.js test/growthAlertHttp.test.js test/growthExperience.test.js test/growthCrossDay.test.js test/growthInbox.test.js test/growthReviewHttp.test.js test/growthActionWorkflow.test.js test/growthTriage.test.js test/growthPlanner.test.js test/growthDaily.test.js test/analysisRecoveryIsolation.test.js test/analysisResumeHttp.test.js test/resumePlan.test.js test/partialInvestigationResume.test.js test/analysisCancelHttp.test.js test/validatedFinalCheckpoint.test.js test/validatedFinalRecovery.test.js test/workerStart.test.js test/recoveryDecision.test.js test/agentKilledWorker.test.js test/agentRestartPersistence.test.js test/agentFollowupCheckpoint.test.js             test/agentFollowupRunner.test.js             test/agentTrace.test.js             test/agentResponseCheckpoint.test.js             test/agentInvestigationCheckpoint.test.js             test/checkpointState.test.js             test/transcriptRecovery.test.js             test/checkpointHttp.test.js             test/jobStatus.test.js             test/jobStatusHttp.test.js             test/retrySafety.test.js             test/retrySafetyHttp.test.js

      - name: Run Growth Workspace and Token efficiency regression tests
        env:
          NODE_ENV: test
        run: |
          node --test test/agentFoundation.test.js test/agentFollowupRunner.test.js test/agentCapabilityContext.test.js test/modelEvidenceCompact.test.js test/agentTokenFollowup.test.js test/batchAnomalies.test.js test/aiUsageBudget.test.js test/aiRelayProvider.test.js test/aiCostUnknownGuard.test.js test/growthWorkspaceHttp.test.js test/growthWorkspaceMetric.test.js

  ai-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: PostgreSQL fencing and Bull/Redis contention
        env:
          AI_P0_INTEGRATION: '1'
          AI_DATABASE_URL: postgres://ci:ci@localhost:5432/ai_test
          REDIS_URL: redis://localhost:6379
        run: node --test --test-concurrency=1 test/autonomyBudgetIntegration.test.js test/growthAgentForecastIntegration.test.js test/growthAgentOutboxIntegration.test.js test/growthSchedulerHealthIntegration.test.js test/growthAutonomyIntegration.test.js test/aiMigrationIntegration.test.js test/gscIntegration.test.js test/growthSeoIntegration.test.js test/growthAlertIntegration.test.js test/growthProposalIntegration.test.js test/growthBudgetIntegration.test.js test/workerLeaseIntegration.test.js

  ai-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test -- --run src/analytics/__tests__/aiRecoveryPage.test.js
      - name: Run Agent tab loading regression tests
        run: npm test -- --run src/analytics/__tests__/growthAgentRequestPlan.test.js
      - run: npm run build
