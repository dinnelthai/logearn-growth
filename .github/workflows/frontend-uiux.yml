name: Growth desktop UI regression

on:
  push:
    branches:
      - codex/uiux-rebuild
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-uiux.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-uiux.yml'

permissions:
  contents: read

jobs:
  frontend-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify workspace modules parse
        run: |
          node --check src/dashboard.js
          node --check src/navigation.js
          node --check src/workspaceQuickJump.js
          node --check src/pages/aiTaskStatus.js
          node --check src/pages/aiAnalysis.js
      - name: Run all frontend unit tests
        run: npm test
      - name: Build desktop workspace
        run: npm run build
