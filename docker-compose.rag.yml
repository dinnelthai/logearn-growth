version: '3.8'

services:
  # Redis - LLM 缓存和队列
  redis:
    image: redis:7-alpine
    container_name: logearn-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - logearn-network

  # Qdrant - 向量数据库
  qdrant:
    image: qdrant/qdrant:latest
    container_name: logearn-qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC (可选)
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - logearn-network

volumes:
  redis_data:
    driver: local
  qdrant_data:
    driver: local

networks:
  logearn-network:
    driver: bridge
