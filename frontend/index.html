<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6f9" />
    <meta name="description" content="LogEarn 数据分析后台交互原型" />
    <title>LogEarn 数据分析后台</title>
  </head>
  <body>
    <div id="app">
<div id="la-studio">

<div class="a-top"><div class="a-brand" aria-label="LogEarn"><svg class="a-brandmark" viewBox="0 0 46 40" aria-hidden="true"><path class="a-wing" d="M17 2C9 8 3 17 4 27c1 6 6 10 14 11-6-8-7-23-1-36Z"/><path class="a-wing" d="M29 2c8 6 14 15 13 25-1 6-6 10-14 11 6-8 7-23 1-36Z"/><text class="a-e" x="14" y="31">e</text></svg><span class="a-brandword">Log<span>Earn</span></span></div><nav class="a-topnav" aria-label="分析类型"><button class="a-nav cursor-interaction" data-mode="north" aria-pressed="true">北极星指标</button><button class="a-nav cursor-interaction" data-mode="channels" aria-pressed="false">渠道分析</button><button class="a-nav cursor-interaction" data-mode="funnel" aria-pressed="false">漏斗分析</button><button class="a-nav cursor-interaction" data-mode="retention" aria-pressed="false">留存分析</button><button class="a-nav cursor-interaction" data-mode="referral" aria-pressed="false">推荐与增长循环</button><button class="a-nav cursor-interaction" data-mode="segments" aria-pressed="false">用户分群</button></nav><span class="a-badge">交互原型 · 合成演示数据</span></div>
<div class="a-head"><div><h1 id="as-title">北极星指标 · 有效分析用户</h1><p class="a-muted" id="as-sub">有多少用户真正获得了筹码分析的价值</p></div><div class="a-actions"><span id="as-saved" class="a-toast" aria-live="polite"></span><button id="as-restore" class="a-button cursor-interaction" hidden>载入保存</button><button id="as-save" class="a-button cursor-interaction">保存分析</button></div></div>
<div class="a-layout"><aside class="a-config" aria-label="分析配置"><div class="a-section"><div class="a-sectionhead"><h2 id="as-config-title">漏斗步骤</h2><span class="a-muted" id="as-stepcount">3 步</span></div><div id="as-steps"></div><button id="as-add" class="a-link cursor-interaction">＋ 添加步骤</button></div><div class="a-section"><h2>分析条件</h2><label>统计日期<select id="as-range"><option value="7" selected>09/28–10/04 · 7 天</option><option value="14">09/21–10/04 · 14 天</option></select></label><label id="as-window-label">转化窗口<select id="as-window"><option value="24">24 小时</option><option value="1">1 小时</option><option value="72">72 小时</option></select></label><label><span id="as-source-caption">首次行为来源</span><select id="as-source"><option value="all">全部来源</option><option>SEO</option><option>直接访问</option><option>Bot</option><option>社群</option><option>邀请</option><option>KOL/合作</option></select></label><label id="as-strategy-label">AI 策略条件<select id="as-strategy"><option value="all">全部策略</option><option>1.5段</option><option>日内2段</option></select></label><p id="as-strategy-note" class="a-muted">仅约束 AI 开启步骤</p></div><div class="a-section"><button id="as-run" class="a-button a-primary a-wide cursor-interaction">运行分析</button><p id="as-dirty" class="a-muted" aria-live="polite">已应用当前配置</p></div></aside><section class="a-result" aria-label="分析结果"><div id="as-output" aria-live="polite"></div></section></div>
<div id="as-drill" class="a-drawer" hidden></div><div class="a-footer"><span>按用户去重 · 业务日 UTC+7 · 登录起点为建议新增采集</span><span>演示观测截至 2026/10/05 13:00</span></div>


</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
