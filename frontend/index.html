<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6f9" />
    <meta name="description" content="LogEarn 数据分析后台交互原型" />
    <title>LogEarn 数据分析后台</title>
  </head>
  <body>
    <div id="app">
<div id="la-studio">

<div class="a-top"><div class="a-brand" aria-label="LogEarn"><svg class="a-brandmark" viewBox="0 0 46 40" aria-hidden="true"><path class="a-wing" d="M17 2C9 8 3 17 4 27c1 6 6 10 14 11-6-8-7-23-1-36Z"/><path class="a-wing" d="M29 2c8 6 14 15 13 25-1 6-6 10-14 11 6-8 7-23 1-36Z"/><text class="a-e" x="14" y="31">e</text></svg><span class="a-brandword">Log<span>Earn</span></span></div><nav class="a-topnav" aria-label="分析类型"><button class="a-nav cursor-interaction" data-mode="north" aria-pressed="true">北极星指标</button><div class="a-nav-group"><button class="a-nav a-nav-parent cursor-interaction" data-mode-group="monitor" aria-pressed="false" aria-haspopup="true" aria-expanded="false">线上监控 ▾</button><div class="a-nav-dropdown" role="menu"><button class="a-nav-sub cursor-interaction" data-mode="trade-monitor" role="menuitem">交易成功率</button></div></div><button class="a-nav cursor-interaction" data-mode="channels" aria-pressed="false">渠道分析</button><button class="a-nav cursor-interaction" data-mode="funnel" aria-pressed="false">漏斗分析</button><button class="a-nav cursor-interaction" data-mode="paths" aria-pressed="false">行为路径</button><button class="a-nav cursor-interaction" data-mode="retention" aria-pressed="false">留存分析</button><button class="a-nav cursor-interaction" data-mode="referral" aria-pressed="false">推荐与增长循环</button><button class="a-nav cursor-interaction" data-mode="segments" aria-pressed="false">用户分群</button><button class="a-nav cursor-interaction" data-mode="value" aria-pressed="false">价值闭环</button></nav><span id="as-data-badge" class="a-badge">数据加载中</span></div>
<div class="a-head"><div><h1 id="as-title">北极星指标 · 有效分析用户</h1><p class="a-muted" id="as-sub">有多少用户真正获得了筹码分析的价值</p></div><div class="a-actions"><span id="as-saved" class="a-toast" aria-live="polite"></span><button id="as-restore" class="a-button cursor-interaction" hidden>载入保存</button><button id="as-save" class="a-button cursor-interaction">保存配置</button></div></div>
<p id="as-data-status" class="a-data-status" role="status">正在加载数据…</p><div class="a-layout"><aside class="a-config" aria-label="分析配置"><div class="a-section"><div class="a-sectionhead"><h2 id="as-config-title">漏斗步骤</h2><span class="a-muted" id="as-stepcount">3 步</span></div><div id="as-presets" hidden><label>漏斗预设<select id="as-preset"><option value="ai">AI 激活 · 四步</option><option value="overall">整体激活 · 三步</option><option value="token_visit">同次 Token · 点击→详情→分析</option><option value="strategy_run">同次策略 · 启动→结果→查看</option><option value="custom">自定义步骤</option></select></label><p class="a-muted">整体激活不要求AI；不能据此区分AI与非AI路径。</p></div><div id="as-steps"></div><button id="as-add" class="a-link cursor-interaction">＋ 添加步骤</button></div><div class="a-section"><h2>分析条件</h2><label>统计日期<select id="as-range"><option value="7">09/28–10/04 · 7 天</option><option value="14" selected>09/21–10/04 · 14 天</option></select></label><p id="as-range-note" class="a-muted" hidden>分群使用观测截至时间，按近7/28天行为计算。</p><label id="as-association-label" hidden>关联模式<select id="as-association"><option value="user">用户顺序</option><option value="token_visit">同一次 Token 访问</option><option value="strategy_run">同一次策略运行</option></select></label><label id="as-window-label">转化窗口<select id="as-window"><option value="24">24 小时</option><option value="1">1 小时</option><option value="72">72 小时</option></select></label><label><span id="as-source-caption">首次行为来源</span><select id="as-source"><option value="all">全部来源</option><option>SEO</option><option>直接访问</option><option>Bot</option><option>社群</option><option>邀请</option><option>KOL/合作</option></select></label><label id="as-strategy-label">AI 策略条件<select id="as-strategy"><option value="all">全部策略</option><option>1.5段</option><option>日内2段</option></select></label><p id="as-strategy-note" class="a-muted">仅约束 AI 开启步骤</p></div><div class="a-section"><button id="as-run" class="a-button a-primary a-wide cursor-interaction">运行分析</button><p id="as-dirty" class="a-muted" aria-live="polite">已应用当前配置</p></div></aside><section class="a-result" aria-label="分析结果"><p id="as-stale" class="a-stale" role="status" hidden>配置尚未应用，当前展示上次运行结果。</p><div id="as-output" aria-live="polite"></div></section></div>
<dialog id="as-drill" class="a-drawer" aria-labelledby="as-drawer-title"></dialog><div class="a-footer"><span>按用户去重 · 业务日 UTC+7 · 登录起点为建议新增采集</span><span id="as-data-time"></span></div>


</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
