<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Growth 本地验收</title><style>body{margin:0;padding:24px;background:#f5f7fb}h1{margin:16px 0}#la-studio{max-width:1440px;margin:auto;padding:20px}</style><div id="la-studio"><h1>Growth 本地验收</h1><p>活动使用隔离演示数据；注册与复访来自只读聚合快照。</p><div class="si-page gi-page"><div data-gi-content id="cohorts"></div><section class="a-card si-panel" data-activity-evidence id="evidence"></section></div></div><script type="module">
